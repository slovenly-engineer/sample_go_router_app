name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read  # CI結果参照用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Review Type
        id: review-type
        run: |
          if [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            echo "type=dependabot" >> $GITHUB_OUTPUT
            echo "Detected Dependabot PR - using dependency review"
          else
            echo "type=feature" >> $GITHUB_OUTPUT
            echo "Detected Feature PR - using Flutter/Dart review"
          fi

      - name: Run Dependabot Review
        if: steps.review-type.outputs.type == 'dependabot'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          allowed_bots: 'dependabot[bot]'
          additional_permissions: |
            actions: read

      - name: Run Flutter/Dart Review
        if: steps.review-type.outputs.type == 'feature'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          additional_permissions: |
            actions: read
          prompt: |
            このFlutter/DartプロジェクトのPRを包括的にレビューしてください。

            レビュー基準は .github/codex/prompts/flutter-review.md を参照してください。

            また、以下のプロジェクト固有のドキュメントも確認してください:
            - docs/review/criteria/code-quality.md（コード品質基準）
            - docs/review/criteria/architecture.md（アーキテクチャ基準）
            - docs/review/checklist.md（レビューチェックリスト）

            対象PR: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            CI結果（pr-analysis.yml）も確認して、静的解析やテスト結果を考慮してください。
